name: RTOR-CLIENT
options:
  bundleIdPrefix: info.rizal.rtor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  RTOR-Linux:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/zsh
      arguments: "$(SRCROOT)/../scripts/build.sh linux $(ACTION)"
      passSettings: true
      workingDirectory: "$(SRCROOT)/.."
  RTOR-Android:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/zsh
      arguments: "$(SRCROOT)/../scripts/build.sh android $(ACTION)"
      passSettings: true
      workingDirectory: "$(SRCROOT)/.."
  RTOR-UbuntuTouch:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/zsh
      arguments: "$(SRCROOT)/../scripts/build.sh ubuntutouch $(ACTION)"
      passSettings: true
      workingDirectory: "$(SRCROOT)/.."
  # Component: the same sources as the RTORKit Swift package (../ios/RTORKit), as an embeddable iOS framework.
  RTORKit:
    type: framework
    platform: iOS
    sources:
      - path: ../ios/RTORKit/Sources/RTORKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.rizal.rtor.kit
        PRODUCT_NAME: RTORKit
        GENERATE_INFOPLIST_FILE: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
        SKIP_INSTALL: "NO"
  # Standalone app.
  RTOR:
    type: application
    platform: iOS
    sources:
      - path: ../ios/RTORApp
    dependencies:
      - target: RTORKit
        embed: true
    info:
      path: ../ios/RTORApp/Info.plist
      properties:
        CFBundleDisplayName: RTOR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: info.rizal.rtor.magnet
            CFBundleURLSchemes: [magnet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: RZL file
            LSHandlerRank: Owner
            LSItemContentTypes: [info.rizal.rzl]
          - CFBundleTypeName: RTOR file
            LSHandlerRank: Owner
            LSItemContentTypes: [info.rizal.rtor]
          - CFBundleTypeName: Magnet link file
            LSHandlerRank: Owner
            LSItemContentTypes: [info.rizal.magnet]
          - CFBundleTypeName: BitTorrent file
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
          - CFBundleTypeName: Crypto file (public JSON export)
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
          - CFBundleTypeName: Public certificate / PEM
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.x509-certificate, info.rizal.pem]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: info.rizal.rzl
            UTTypeDescription: RZL file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rzl]
              public.mime-type: [application/vnd.rizal.rzl]
          - UTTypeIdentifier: info.rizal.rtor
            UTTypeDescription: RTOR file
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [rtor]
              public.mime-type: [application/vnd.rizal.rtor]
          - UTTypeIdentifier: info.rizal.magnet
            UTTypeDescription: Magnet link file
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [magnet]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
          - UTTypeIdentifier: info.rizal.pem
            UTTypeDescription: PEM file
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [pem]
              public.mime-type: [application/x-pem-file]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.rizal.rtor
        PRODUCT_NAME: RTOR
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  RTOR-Linux:
    build:
      targets:
        RTOR-Linux: all
  RTOR-Android:
    build:
      targets:
        RTOR-Android: all
  RTOR-UbuntuTouch:
    build:
      targets:
        RTOR-UbuntuTouch: all
  RTORKit:
    build:
      targets:
        RTORKit: all
  RTOR:
    build:
      targets:
        RTOR: all
